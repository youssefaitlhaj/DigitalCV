                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Impressum link
                name: impressum
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Code link
                name: codeLink
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Live link

                        hint: "Markdown. Inline extras (type them in the editor's raw/Markdown mode): <u>underlined</u>; colour a phrase with a span: <span class=\"c-accent\">Accent</span>, <span class=\"c-muted\">Muted</span>, <span class=\"c-highlight\">Highlight</span>, <span class=\"c-positive\">Green</span>."
                      - label: Deutsch
                        name: de
                        widget: markdown
                        required: true
                        hint: "Markdown. Inline extras (type them in the editor's raw/Markdown mode): <u>underlined</u>; colour a phrase with a span: <span class=\"c-accent\">Accent</span>, <span class=\"c-muted\">Muted</span>, <span class=\"c-highlight\">Highlight</span>, <span class=\"c-positive\">Green</span>."

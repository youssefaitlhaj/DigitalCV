# Generated once from the Zod schemas in src/content/schemas; kept in sync by tests/unit/admin/config-contract.test.ts.
backend:
  name: github
  repo: youssefaitlhaj/DigitalCV
  branch: main
  base_url: https://sveltia-auth.invalid
  preview_context: preview/deploy
publish_mode:
  type: preview
  allow_incomplete_drafts: false
output:
  omit_empty_optional_fields: true
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
locale: en
collections:
  - name: content
    label: Content
    files:
      - name: site
        label: Site settings
        file: src/content/data/site.yml
        format: yaml
        fields:
          - label: Name
            name: name
            widget: string
            required: true
          - label: Logo text
            name: logoText
            widget: string
            required: true
          - label: Search and sharing
            name: meta
            widget: object
            fields:
              - label: Title
                name: title
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Description
                name: description
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
            required: true
          - label: Email (stored as two halves)
            name: email
            widget: object
            fields:
              - label: Before the @
                name: user
                widget: string
                required: true
              - label: After the @
                name: domain
                widget: string
                required: true
            required: true
          - label: LinkedIn URL
            name: linkedin
            widget: string
            pattern:
              - ^https?://
              - Must start with http:// or https://
            required: true
          - label: Location
            name: location
            widget: object
            required: true
            fields:
              - label: English
                name: en
                widget: string
                required: true
              - label: Deutsch
                name: de
                widget: string
                required: true
          - label: Site URL
            name: siteUrl
            widget: string
            pattern:
              - ^https?://
              - Must start with http:// or https://
            required: true
          - label: Palette
            name: palette
            widget: object
            fields:
              - label: Accent colour
                name: accent
                widget: select
                options:
                  - whisky
                  - bourbon
                  - singleMalt
                  - green
                required: true
              - label: Background
                name: background
                widget: select
                options:
                  - oat
                  - paper
                  - stone
                  - white
                required: true
            required: true
          - label: PDF
            name: pdf
            widget: object
            fields:
              - label: Include portrait
                name: includePortrait
                widget: boolean
                default: true
                required: true
              - label: File name (without .pdf)
                name: fileBaseName
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, digits and hyphens only
                hint: Used in links; keep it stable.
                required: true
            required: true
          - label: Analytics
            name: analytics
            widget: object
            fields:
              - label: Umami website ID
                name: umamiWebsiteId
                widget: string
                required: false
              - label: Statistics dashboard URL
                name: dashboardUrl
                widget: string
                pattern:
                  - ^https?://
                  - Must start with http:// or https://
                required: false
            required: true
          - label: Interface labels
            name: labels
            widget: object
            fields:
              - label: Present
                name: present
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: year (short)
                name: year
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: years (short)
                name: years
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: month (short)
                name: month
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: months (short)
                name: months
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Employment types
                name: employment
                widget: object
                fields:
                  - label: Full-time
                    name: full-time
                    widget: object
                    required: true
                    fields:
                      - label: English
                        name: en
                        widget: string
                        required: true
                      - label: Deutsch
                        name: de
                        widget: string
                        required: true
                  - label: Part-time
                    name: part-time
                    widget: object
                    required: true
                    fields:
                      - label: English
                        name: en
                        widget: string
                        required: true
                      - label: Deutsch
                        name: de
                        widget: string
                        required: true
                  - label: Internship
                    name: internship
                    widget: object
                    required: true
                    fields:
                      - label: English
                        name: en
                        widget: string
                        required: true
                      - label: Deutsch
                        name: de
                        widget: string
                        required: true
                required: true
              - label: Download CV
                name: downloadCv
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Skip to content
                name: skipToContent
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Theme toggle
                name: themeToggle
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Language
                name: language
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Privacy link

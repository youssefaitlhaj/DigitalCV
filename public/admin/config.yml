                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
              - label: Confidential
                name: confidential
                widget: object
                required: true
                fields:
                  - label: English
                    name: en
                    widget: string
                    required: true
                  - label: Deutsch
                    name: de
                    widget: string
                    required: true
            collapsed: true
            required: true
      - name: page
        label: Page sections
        file: src/content/data/page.yml
        format: yaml
        fields:

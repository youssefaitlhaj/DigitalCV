                        widget: string
                        required: true
                      - label: Deutsch
                        name: de
                        widget: string
                        required: true
                  - label: Show motto
                    name: showMotto
                    widget: boolean
                    default: false
                    required: false
              - label: Statement
                name: statement
                widget: object
                summary: "Statement: {{fields.title.en}}"
                fields:

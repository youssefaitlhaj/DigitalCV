                    summary: "{{fields.label.en}}"
                    fields:
                      - label: Label
                        name: label
                        widget: object
                        required: true
                        fields:
                          - label: English
                            name: en
                            widget: string
                            required: true
                          - label: Deutsch
                            name: de
                            widget: string
                            required: true
                      - label: Value
                        name: value
                        widget: object
                        fields:
                          - label: Kind
                            name: kind
                            widget: select
                            options:
                              - number

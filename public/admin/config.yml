                          - label: N (kind number)
                            name: n
                            widget: number
                            value_type: float
                            required: false
                          - label: Date YYYY-MM (kind yearsSince)
                            name: date
                            widget: string
                            pattern:
                              - ^(\d{4}-(0[1-9]|1[0-2])|present)$
                              - YYYY-MM or "present"

name: CI

# Runs on pull requests only (deploy.yml covers main).
# Required check for branch protection on main: the job named "ci".
# The "preview" jobs are deliberately NOT required checks. Publish is gated by
# the "ci" check plus the "preview/deploy" commit status.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - run: npm run test:pdf
      - run: npx playwright test
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload built site for preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 3

  # Deploys the PR build to a Cloudflare Pages branch preview and reports its URL
  # as the commit status Sveltia CMS reads (backend.preview_context).
  preview:
    name: preview
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy preview
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -o pipefail
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CF_PAGES_PROJECT" ] || missing="$missing CF_PAGES_PROJECT(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing preview configuration:$missing"
            exit 1
          fi
          npx wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$HEAD_REF" --commit-dirty=true | tee wrangler.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' wrangler.log | tail -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::Could not find the preview URL in wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post preview/deploy status
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context=preview/deploy \
            -f description="Preview deployed" \
            -f target_url="$PREVIEW_URL"
      - name: Post failed preview/deploy status
        if: ${{ failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context=preview/deploy \
            -f description="Preview deploy failed" \
            -f target_url="$RUN_URL"

  # If tests or the build fail, mark preview/deploy as failed so Publish is blocked
  # and the failure is visible next to the entry. (The required "ci" check also fails.)
  preview-failed:
    name: preview-failed
    needs: ci
    if: ${{ always() && needs.ci.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post failed preview/deploy status
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context=preview/deploy \
            -f description="Build or tests failed" \
            -f target_url="$RUN_URL"

name: Deploy

# Production deploy. Rebuilds and re-runs check, unit and PDF tests from scratch;
# if any fail, the deploy job never runs. E2E is not repeated here: the required
# "ci" check already ran it on the same content before the PR was merged.
# Cloudflare secrets are only visible to the wrangler step of the deploy job,
# never to install, build or test code.
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_DEPLOY_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - run: npm run test:pdf
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CF_PAGES_PROJECT" ] || missing="$missing CF_PAGES_PROJECT(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy configuration:$missing"
            exit 1
          fi
          npx wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch=main --commit-dirty=true

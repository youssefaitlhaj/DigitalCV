name: Deploy

# Production deploy. Rebuilds and re-runs check, unit and PDF tests from scratch;
# if any fail, the deploy job never runs. E2E is not repeated here: the required
# "ci" check already ran it on the same content before the PR was merged.
# GitHub builds, Vercel only hosts: the deploy job turns dist/ into Vercel's Build
# Output (scripts/vercel-output.ts) and uploads it with `vercel deploy --prebuilt`.
# VERCEL_TOKEN is only visible to that one step, never to install, build or test code.
on:
  push:
    branches: [main]
  workflow_call:
  # Manual redeploy: Actions, Deploy, Run workflow (branch main).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_DEPLOY_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - run: npm run test:pdf
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    # Production is only ever built from main, even if Run workflow is started on another branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Prepare Vercel build output
        run: npx tsx scripts/vercel-output.ts
      - name: Deploy to Vercel (production)
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID(variable)"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy configuration:$missing"
            exit 1
          fi
          npx vercel deploy --prebuilt --prod --yes

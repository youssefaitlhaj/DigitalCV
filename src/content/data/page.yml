  - type: text
    id: about
    title: { en: About, de: Über mich }
    paragraphs:
      - en: I build software at Imbus AG in Bavaria, where I have spent the better part of seven years working on TestBench, their test management platform, first alongside my computer science degree, now full time.
        de: Ich entwickle Software bei Imbus AG in Bayern, wo ich den größten Teil der vergangenen sieben Jahre an TestBench gearbeitet habe, der Testmanagement-Plattform des Hauses, zunächst neben meinem Informatikstudium, inzwischen in Vollzeit.
      - en: "The path here started in Casablanca, with a technician diploma, a bachelor's degree, and three internships: a software house, a transport insurer, an environmental association. Building a store management tool, moving an insurance application to the web, and putting a non-profit's programme online taught me how differently the same craft looks depending on who it serves."
        de: "Angefangen hat der Weg in Casablanca, mit einem Fachtechnikerdiplom, einem Bachelor-Abschluss und drei Praktika: ein Softwarehaus, ein Transportversicherer, ein Umweltbildungsverein. Eine Lagerverwaltung zu bauen, eine Versicherungsanwendung ins Web zu holen und das Programm eines Vereins online zu bringen, hat mir gezeigt, wie unterschiedlich dasselbe Handwerk aussieht, je nachdem, wem es dient."
      - en: Then I moved to Germany, took a second bachelor's at the University of Bamberg in Software Systems Science, and kept building the whole way through.
        de: Dann bin ich nach Deutschland gezogen, habe an der Universität Bamberg einen zweiten Bachelor in Software Systems Science gemacht und die ganze Zeit über weiter entwickelt.
      - en: I work in Java, C#, and .NET, with SQL underneath and the web on top.
        de: Ich arbeite mit Java, C# und .NET, mit SQL darunter und dem Web darüber.
      - en: I also speak four languages, which has been quietly useful in a field where most of the work is understanding what someone actually meant.
        de: Außerdem spreche ich vier Sprachen — was sich in einem Beruf, in dem es meistens darum geht zu verstehen, was jemand eigentlich gemeint hat, still und leise als nützlich erwiesen hat.

